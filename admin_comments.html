<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comment moderation | Let Money Earn</title><link rel="stylesheet" href="styles.css"><style>main{padding:55px 8vw 90px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:18px}.head h1{font:600 50px var(--serif);margin:0}.head a{color:var(--ink);font:11px var(--mono);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:5px}.comment{display:flex;justify-content:space-between;gap:25px;border-bottom:1px solid var(--line);padding:22px 0}.comment small{display:block;color:var(--muted);font:10px var(--mono);margin-top:5px}.comment p{max-width:700px;margin:12px 0 0;color:var(--muted)}.actions{white-space:nowrap}.actions button{border:0;background:transparent;font:11px var(--mono);cursor:pointer;margin-left:12px}.actions button:hover{color:var(--coral)}.status{color:var(--coral);font:11px var(--mono);margin-top:20px}@media(max-width:700px){main{padding:40px 8vw}.head h1{font-size:38px}.comment{display:block}.actions{margin-top:14px}.actions button{margin:0 15px 0 0}}</style></head><body><header class="site-header"><a class="brand" href="admin.html"><img style="width:190px;max-height:62px;object-fit:contain" src="https://raw.githubusercontent.com/mscratnesh/htmlSite/main/images/Let_Money_Earn_Logo_Cropped.png" alt="Let Money Earn"></a></header><main><div class="head"><div><p class="eyebrow">Private moderation</p><h1>Article comments</h1></div><a href="admin.html">Post editor ↗</a></div><div id="comments"></div><p class="status" aria-live="polite"></p></main><script>async function load(){const response=await fetch('/api/admin/comments');if(!response.ok){location.href='admin-login.html';return}const comments=await response.json();document.querySelector('#comments').innerHTML=comments.length?comments.map(comment=>`<article class="comment"><div><strong>${comment.name}</strong><small>${comment.status} · ${comment.post_title} · ${comment.created_at}</small><p>${comment.comment}</p></div><div class="actions">${comment.status==='pending'?`<button data-id="${comment.id}" data-status="approved">Approve</button><button data-id="${comment.id}" data-status="rejected">Reject</button>`:''}</div></article>`).join(''):'<p>No comments submitted yet.</p>';document.querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',async()=>{const result=await(await fetch('/api/admin/comments/'+button.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:button.dataset.status})})).json();document.querySelector('.status').textContent=result.message||result.error;load()}))}load();</script></body></html>
