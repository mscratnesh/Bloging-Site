<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post editor | Let Money Earn</title><link rel="stylesheet" href="styles.css"><style>main{padding:48px 8vw 90px}.admin-nav{display:flex;gap:18px;padding:14px 0;border-bottom:1px solid var(--line);font:11px var(--mono)}.admin-nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:3px}.admin-nav a:hover,.admin-nav a.active{color:var(--ink);border-bottom-color:var(--ink)}.admin-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:18px}.admin-head h1{font:600 50px var(--serif);margin:0}.admin-actions{display:flex;gap:10px}.admin-actions button,.post-form button{border:1px solid var(--ink);background:transparent;padding:11px 15px;font:11px var(--mono);cursor:pointer}.post-form{max-width:1000px;padding-top:30px}.meta-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}.post-form label{display:block;font:11px var(--mono);text-transform:uppercase;margin-bottom:18px}.post-form input,.post-form textarea,.post-form select{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);background:transparent;font:13px var(--sans)}.post-form textarea{min-height:84px;resize:vertical}#image-preview{display:block;margin-top:10px;max-height:160px;border:1px solid var(--line)}.toolbar{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;padding:8px;border:1px solid var(--line);border-bottom:0}.toolbar button{min-width:32px;padding:6px 9px;border:1px solid var(--line);background:var(--paper);font:12px var(--sans);cursor:pointer}.toolbar button:hover{background:var(--lime)}.editor{min-height:300px;border:1px solid var(--line);padding:18px;background:#fff;outline:0;font:15px var(--sans);text-transform:none}.editor img{max-width:100%;display:block;margin:12px 0}.editor:focus{border-color:var(--ink)}.editor h2{font:600 30px var(--serif)}.editor blockquote{border-left:3px solid var(--coral);padding-left:15px;color:var(--muted)}.publish-row{display:flex;align-items:center;gap:15px;margin-top:18px}.publish-row button{background:var(--ink);color:var(--paper)}.status{font:11px var(--mono);color:var(--muted)}.status.status-ok{color:var(--success)}.status.status-error{color:var(--coral-text)}.saved-posts{max-width:1000px;margin-top:70px;border-top:1px solid var(--ink)}.saved-posts h2{font:600 30px var(--serif)}.saved-item{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-top:1px solid var(--line);font-size:14px}.saved-item small{display:block;color:var(--muted);font:10px var(--mono);margin-top:4px}.saved-buttons button{border:0;background:transparent;font:11px var(--mono);cursor:pointer;margin-left:12px}.saved-buttons button:hover{color:var(--coral)}@media(max-width:700px){main{padding:38px 8vw 70px}.admin-head h1{font-size:38px}.meta-grid{grid-template-columns:1fr}.saved-item{display:block}.saved-buttons{margin-top:10px}.saved-buttons button{margin:0 14px 0 0}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><img style="width:190px;max-height:62px;object-fit:contain" src="https://raw.githubusercontent.com/mscratnesh/htmlSite/main/images/Let_Money_Earn_Logo_Cropped.png" alt="Let Money Earn"></a></header><main><nav class="admin-nav"><a class="active" href="admin.html">Post editor</a><a href="admin_reviews.html">Customer reviews</a><a href="admin_comments.html">Article comments</a><a href="admin_questions.html">Questions</a></nav><div class="admin-head"><div><p class="eyebrow">Private publishing</p><h1 id="editor-heading">New blog post</h1></div><div class="admin-actions"><button id="new-post">New post</button><button id="logout">Sign out</button></div></div><form class="post-form" id="post-form"><div class="meta-grid"><label>Title<input name="title" required></label><label>Category<select name="category" required><option value="Basics">Basics</option><option value="Investing">Investing</option><option value="Markets">Markets</option><option value="Personal Finance">Personal Finance</option></select></label><label>Date<input name="published_at" placeholder="26 Aug 2026" required></label></div><label>Summary<textarea name="summary" required></textarea></label><div class="meta-grid"><label>Author<input name="author" value="Ratnesh Kumar Singh" required></label><label>Initials<input name="initials" value="RS" required></label><label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label></div><label>Image<input name="image_url" type="text" id="image-url" placeholder="Paste an image (Ctrl+V) or a URL — optional"><img id="image-preview" alt="" hidden></label><input type="hidden" name="image_class" value="desk"><label>Article content<div class="toolbar"><button type="button" data-command="bold"><b>B</b></button><button type="button" data-command="italic"><i>I</i></button><button type="button" data-command="formatBlock" data-value="h2">Heading</button><button type="button" data-command="insertUnorderedList">List</button><button type="button" data-command="formatBlock" data-value="blockquote">Quote</button><button type="button" data-command="createLink">Link</button></div><div class="editor" id="editor" contenteditable="true" role="textbox" aria-label="Article content"></div></label><div class="publish-row"><button type="submit" id="save-button">Save draft ↗</button><span class="status" aria-live="polite"></span></div></form><section class="saved-posts"><h2>Saved posts</h2><div id="saved-list"></div></section></main><script>let editingId=null;const form=document.querySelector('#post-form'),editor=document.querySelector('#editor'),status=document.querySelector('.status'),fields=['title','category','published_at','summary','author','initials','status','image_url'];
function setStatus(text,ok){status.textContent=text;status.classList.toggle('status-ok',ok===true);status.classList.toggle('status-error',ok===false)}async function guard(){const response=await fetch('/api/admin/session');if(!response.ok)location.href='admin-login.html';else loadPosts()}async function loadPosts(){const posts=await(await fetch('/api/admin/posts')).json();document.querySelector('#saved-list').innerHTML=posts.map(post=>`<div class="saved-item"><div><strong>${post.title}</strong><small>${post.status} · ${post.category} · ${post.published_at}</small></div><div class="saved-buttons"><button onclick="editPost(${post.id})">Edit</button><button onclick="deletePost(${post.id})">Delete</button></div></div>`).join('')}async function editPost(id){const post=await(await fetch('/api/admin/posts/'+id)).json();editingId=id;document.querySelector('#editor-heading').textContent='Edit blog post';fields.forEach(field=>form.elements[field].value=post[field]||'');editor.innerHTML=post.content||'';document.querySelector('#save-button').textContent='Update post ↗';showImagePreview(post.image_url);window.scrollTo({top:0,behavior:'smooth'})}
const imageInput=document.querySelector('#image-url'),imagePreview=document.querySelector('#image-preview');
function showImagePreview(url){if(url){imagePreview.src=url;imagePreview.hidden=false}else{imagePreview.hidden=true}}
imageInput.addEventListener('input',()=>showImagePreview(imageInput.value));
function pastedImageFile(event){const item=Array.from(event.clipboardData?.items||[]).find(i=>i.type.startsWith('image/'));return item?item.getAsFile():null}
async function uploadImageFile(file){const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});return(await(await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:dataUrl})})).json())}
imageInput.addEventListener('paste',async(event)=>{const file=pastedImageFile(event);if(!file)return;event.preventDefault();setStatus('Uploading pasted image…');const upload=await uploadImageFile(file);if(upload.url){imageInput.value=upload.url;showImagePreview(upload.url);setStatus('Image uploaded.',true)}else{setStatus(upload.error||'Upload failed.',false)}});
editor.addEventListener('paste',async(event)=>{const file=pastedImageFile(event);if(!file)return;event.preventDefault();setStatus('Uploading pasted image…');const upload=await uploadImageFile(file);if(upload.url){document.execCommand('insertImage',false,upload.url);if(!imageInput.value){imageInput.value=upload.url;showImagePreview(upload.url)}setStatus('Image inserted into article.',true)}else{setStatus(upload.error||'Upload failed.',false)}});async function deletePost(id){if(!confirm('Delete this post?'))return;const result=await(await fetch('/api/admin/posts/'+id,{method:'DELETE'})).json();setStatus(result.message||result.error,!result.error);loadPosts()}document.querySelectorAll('.toolbar button').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.command==='createLink'){const url=prompt('Enter URL');if(url)document.execCommand('createLink',false,url)}else document.execCommand(button.dataset.command,false,button.dataset.value||null);editor.focus()}));form.elements.status.addEventListener('change',event=>{document.querySelector('#save-button').textContent=event.target.value==='published'?'Publish post ↗':'Save draft ↗'});form.addEventListener('submit',async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));data.content=editor.innerHTML;const url=editingId?'/api/admin/posts/'+editingId:'/api/admin/posts';const result=await(await fetch(url,{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})).json();setStatus(result.message||result.error,!result.error);if(result.message){form.reset();editor.innerHTML='';editingId=null;document.querySelector('#editor-heading').textContent='New blog post';document.querySelector('#save-button').textContent='Save draft ↗';showImagePreview('');loadPosts()}});document.querySelector('#new-post').addEventListener('click',()=>{form.reset();editor.innerHTML='';editingId=null;document.querySelector('#editor-heading').textContent='New blog post';showImagePreview('')});document.querySelector('#logout').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='admin-login.html'});guard();</script></body></html>
