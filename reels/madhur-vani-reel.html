<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>मधुर वाणी Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d1c;--panel:#1a1730;--line:#3a3558;--fg:#efe9f7;--muted:#a59fbd;--accent:#f0a24b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Mukta,'Nirmala UI',system-ui,sans-serif;min-height:100vh;display:flex;gap:32px;align-items:center;justify-content:center;flex-wrap:wrap;padding:24px 16px}
canvas{height:min(88vh,1100px);aspect-ratio:9/16;max-width:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
.panel{width:min(340px,100%);display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}
p{margin:0;color:var(--muted)}
button{font:inherit;font-weight:600;padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:#1a1020;border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{display:flex;gap:8px;align-items:center}
#status{min-height:1.5em;color:var(--fg);font-variant-numeric:tabular-nums}
#result{display:flex;flex-direction:column;gap:8px}
#result video{width:100%;border-radius:8px}
#result a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="panel">
  <h1>मधुर वाणी Reel</h1>
  <p>1080×1920 portrait, 25 seconds, with an optional tanpura drone. Watch the preview, then record and download the video.</p>
  <label><input type="checkbox" id="music" checked> Background tanpura</label>
  <button id="preview">▶ Preview</button>
  <button id="record" class="primary">● Record and download video</button>
  <div id="status"></div>
  <div id="result"></div>
  <p>Keep this tab visible while it records. The video records in real time, so it takes 25 seconds.</p>
</div>
<script>
const W = 1080, H = 1920, DUR = 25;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const F_DOHA = "'Tiro Devanagari Hindi','Nirmala UI',serif";
const F_BODY = "Mukta,'Nirmala UI',sans-serif";
const COL = { cream: '#FFF1DA', cool: '#BFE6FF', saffron: '#F4A64E', muted: 'rgba(255,241,218,.62)' };

// ---- Content -------------------------------------------------------------
const EYEBROW = 'संत कबीर के दोहे';
const TITLE = 'मधुर वाणी';
const HEADER = 'मधुर वाणी पर दोहा';
const HALVES = ['ऐसी वाणी बोलिए,', 'मन का आपा खोय।', 'औरन को शीतल करे,', 'आपहुं शीतल होय॥'];
const MEANING = 'मनुष्य को हमेशा ऐसी मीठी और नम्र भाषा बोलनी चाहिए जो सुनने वाले के मन को शांति दे और साथ ही बोलने वाले को भी अंदर से प्रसन्नता और शीतलता का अनुभव हो।';
const SIGNATURE = '— संत कबीर';
const COOL_WORDS = new Set(['शीतल', 'शीतलता']);   // glow in moonlight blue

// ---- Helpers -------------------------------------------------------------
const clamp = x => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const PARTICLES = Array.from({ length: 70 }, () => ({
  x: rnd() * W, y: rnd() * H, r: 1.5 + rnd() * 4, s: 12 + rnd() * 30, p: rnd() * 6.28, a: .25 + rnd() * .5
}));

function background(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#141238'); g.addColorStop(.5, '#2c1a45'); g.addColorStop(.85, '#5a2a3c'); g.addColorStop(1, '#7b3a2c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // the cool moon: शीतलता
  const mx = W * .76, my = H * .11 + Math.sin(t * .3) * 8;
  const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 420);
  mg.addColorStop(0, 'rgba(200,230,255,.35)'); mg.addColorStop(.25, 'rgba(170,210,255,.12)'); mg.addColorStop(1, 'rgba(170,210,255,0)');
  ctx.fillStyle = mg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(235,245,255,.92)';
  ctx.beginPath(); ctx.arc(mx, my, 70, 0, 7); ctx.fill();

  // warm diya glow from below
  const lg = ctx.createRadialGradient(W / 2, H + 200, 0, W / 2, H + 200, 1100);
  lg.addColorStop(0, 'rgba(255,170,80,.35)'); lg.addColorStop(1, 'rgba(255,170,80,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);

  for (const p of PARTICLES) {
    const y = ((p.y - t * p.s) % H + H) % H, x = p.x + Math.sin(t * .6 + p.p) * 18;
    const tw = .6 + .4 * Math.sin(t * 2 + p.p);
    ctx.fillStyle = `rgba(255,214,150,${p.a * tw})`;
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, 7); ctx.fill();
  }
}

function centerText(text, y, font, color, alpha, dy = 0) {
  if (alpha <= 0) return;
  ctx.font = font; ctx.fillStyle = color; ctx.globalAlpha = alpha;
  ctx.textAlign = 'center'; ctx.fillText(text, W / 2, y + dy);
  ctx.textAlign = 'left'; ctx.globalAlpha = 1;
}

function ornament(y, alpha, half = 220) {
  if (alpha <= 0) return;
  const cx = W / 2, w = half * eo(alpha);
  ctx.globalAlpha = alpha; ctx.strokeStyle = COL.saffron; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - w, y); ctx.lineTo(cx - 26, y); ctx.moveTo(cx + 26, y); ctx.lineTo(cx + w, y); ctx.stroke();
  ctx.fillStyle = COL.saffron;
  ctx.beginPath(); ctx.moveTo(cx, y - 10); ctx.lineTo(cx + 10, y); ctx.lineTo(cx, y + 10); ctx.lineTo(cx - 10, y); ctx.fill();
  ctx.globalAlpha = 1;
}

// Reveal a line word by word, centred on cx.
function drawWords(line, y, font, t0, gap, t, alpha) {
  if (alpha <= 0) return;
  ctx.font = font;
  const ws = line.split(' '), sp = ctx.measureText(' ').width;
  const widths = ws.map(w => ctx.measureText(w).width);
  let x = W / 2 - (widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1)) / 2;
  ws.forEach((w, i) => {
    const k = eo(seg(t, t0 + i * gap, t0 + i * gap + .6));
    if (k > 0) {
      const cool = COOL_WORDS.has(w.replace(/[,।॥]/g, ''));
      ctx.globalAlpha = alpha * k;
      ctx.fillStyle = cool ? COL.cool : COL.cream;
      ctx.shadowColor = cool ? 'rgba(160,215,255,.9)' : 'rgba(0,0,0,.35)';
      ctx.shadowBlur = cool ? 30 : 12;
      ctx.fillText(w, x, y + (1 - k) * 24);
    }
    x += widths[i] + sp;
  });
  ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
}

function wrap(text, font, maxW) {
  ctx.font = font;
  const lines = []; let line = '';
  for (const w of text.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// ---- Timeline ------------------------------------------------------------
// 0–3.6 title · 3.6–12 doha · 12–21 अर्थ · 21–25 doha recap
function render(t) {
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  background(t);

  // Title card
  const aA = eo(seg(t, .3, 1.3)) * (1 - seg(t, 3.0, 3.6));
  centerText(EYEBROW, 860, `600 46px ${F_BODY}`, COL.saffron, aA);
  centerText(TITLE, 1040, `170px ${F_DOHA}`, COL.cream, aA, (1 - eo(seg(t, .3, 1.3))) * 40);
  ornament(1130, aA, 260);

  // Persistent header
  const aH = eo(seg(t, 3.6, 4.4));
  centerText(HEADER, 400, `600 54px ${F_BODY}`, COL.saffron, aH);
  ornament(450, aH, 200);

  // Doha, revealed word by word
  const bOut = 1 - seg(t, 11.4, 12.1);
  if (t > 3.8 && bOut > 0) {
    const ys = [820, 950, 1190, 1320], starts = [4.2, 5.6, 7.4, 8.8];
    HALVES.forEach((h, i) => drawWords(h, ys[i], `92px ${F_DOHA}`, starts[i], .28, t, bOut));
    ornament(1050, seg(t, 7, 7.6) * bOut, 120);
  }

  // Meaning
  const cA = eo(seg(t, 12.1, 12.8)) * (1 - seg(t, 20.4, 21));
  if (cA > 0) {
    centerText('अर्थ', 720, `72px ${F_DOHA}`, COL.saffron, cA);
    const font = `500 58px ${F_BODY}`;
    wrap(MEANING, font, 880).forEach((ln, i) => drawWords(ln, 860 + i * 96, font, 12.6 + i * .8, .05, t, cA));
  }

  // Recap
  const dA = eo(seg(t, 21, 21.8));
  if (dA > 0) {
    const ys = [820, 925, 1080, 1185];
    HALVES.forEach((h, i) => drawWords(h, ys[i], `76px ${F_DOHA}`, 21 + i * .15, 0, t, dA));
    ornament(1000, dA, 110);
    centerText(SIGNATURE, 1320, `500 46px ${F_BODY}`, COL.muted, eo(seg(t, 22, 22.8)));
  }

  // Fade in from black
  const black = 1 - seg(t, 0, .6);
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
}

// ---- Tanpura drone (Pa · Sa · Sa · low Sa) --------------------------------
let ac = null, dest = null;
function startAudio() {
  ac = new AudioContext();
  dest = ac.createMediaStreamDestination();
  const master = ac.createGain();
  master.connect(ac.destination); master.connect(dest);
  const now = ac.currentTime + .05;
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(.55, now + 2);
  master.gain.setValueAtTime(.55, now + DUR - 1.5);
  master.gain.linearRampToValueAtTime(0, now + DUR);

  const SA = 130.81, strings = [SA * .75, SA, SA, SA / 2];
  for (let i = 0, time = now; time < now + DUR; i++, time += .75) pluck(strings[i % 4], time, master);
}
function pluck(f, time, out) {
  const g = ac.createGain(), lp = ac.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2200, time); lp.frequency.exponentialRampToValueAtTime(500, time + 3);
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(.16, time + .02);
  g.gain.exponentialRampToValueAtTime(.001, time + 3.6);
  lp.connect(g); g.connect(out);
  for (const [mul, type] of [[1, 'sawtooth'], [1.003, 'sawtooth'], [2, 'sine']]) {
    const o = ac.createOscillator();
    o.type = type; o.frequency.value = f * mul;
    o.connect(lp); o.start(time); o.stop(time + 3.7);
  }
}

// ---- Playback and recording ----------------------------------------------
const $ = id => document.getElementById(id);
const setStatus = s => $('status').textContent = s;
function busy(on) { $('preview').disabled = on; $('record').disabled = on; $('music').disabled = on; }

async function run(record) {
  busy(true);
  const music = $('music').checked;
  if (music) startAudio();

  let rec = null, chunks = [], mime = '';
  if (record) {
    const stream = cv.captureStream(30);
    if (music) stream.addTrack(dest.stream.getAudioTracks()[0]);
    mime = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4',
            'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.start(250);
  }

  const t0 = performance.now();
  await new Promise(done => {
    (function frame() {
      const t = (performance.now() - t0) / 1000;
      render(Math.min(t, DUR));
      setStatus(`${record ? 'Recording' : 'Playing'}… ${Math.min(t, DUR).toFixed(1)} / ${DUR}s`);
      if (t < DUR) requestAnimationFrame(frame); else done();
    })();
  });

  if (rec) {
    await new Promise(r => { rec.onstop = r; rec.stop(); });
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(new Blob(chunks, { type: mime || 'video/webm' }));
    $('result').innerHTML = '';
    const a = Object.assign(document.createElement('a'), { href: url, download: `madhur-vani-reel.${ext}`, textContent: `⬇ Download madhur-vani-reel.${ext}` });
    const v = Object.assign(document.createElement('video'), { src: url, controls: true });
    $('result').append(a, v);
    a.click();
    setStatus(ext === 'mp4' ? 'Done. Saved as MP4.' : 'Done. Saved as WebM. Instagram may need it converted to MP4.');
  } else setStatus('Preview finished.');

  if (ac) { ac.close(); ac = null; }
  busy(false);
}

$('preview').onclick = () => run(false);
$('record').onclick = () => run(true);

// Draw a still once the Hindi fonts are ready (falls back to Nirmala UI offline).
Promise.all([
  document.fonts.load(`92px ${F_DOHA}`, 'मधुर वाणी'),
  document.fonts.load(`500 58px ${F_BODY}`, 'मधुर वाणी'),
]).catch(() => {}).finally(() => render(10.5));
</script>
</body>
</html>
