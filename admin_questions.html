<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questions | Let Money Earn</title><link rel="stylesheet" href="styles.css"><style>main{padding:55px 8vw 90px}.admin-nav{display:flex;gap:18px;padding:14px 0;border-bottom:1px solid var(--line);font:11px var(--mono)}.admin-nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:3px}.admin-nav a:hover,.admin-nav a.active{color:var(--ink);border-bottom-color:var(--ink)}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:18px}.head h1{font:600 50px var(--serif);margin:0}.question{display:flex;justify-content:space-between;gap:25px;border-bottom:1px solid var(--line);padding:22px 0}.question small{display:block;color:var(--muted);font:10px var(--mono);margin-top:5px}.question p{max-width:700px;margin:12px 0 0;color:var(--muted)}.actions{white-space:nowrap}.actions a{color:var(--ink);text-decoration:none;font:11px var(--mono);border-bottom:1px solid var(--ink);padding-bottom:4px}.actions a:hover{color:var(--coral)}@media(max-width:700px){main{padding:40px 8vw}.head h1{font-size:38px}.question{display:block}.actions{margin-top:14px}}</style></head><body><header class="site-header"><a class="brand" href="admin.html"><img style="width:190px;max-height:62px;object-fit:contain" src="https://raw.githubusercontent.com/mscratnesh/htmlSite/main/images/Let_Money_Earn_Logo_Cropped.png" alt="Let Money Earn"></a></header><main><nav class="admin-nav"><a href="admin.html">Post editor</a><a href="admin_reviews.html">Customer reviews</a><a href="admin_comments.html">Article comments</a><a class="active" href="admin_questions.html">Questions</a></nav><div class="head"><div><p class="eyebrow">Private inbox</p><h1>Questions</h1></div></div><div id="questions"></div><p class="status" aria-live="polite"></p></main><script>async function load(){const response=await fetch('/api/admin/questions');if(!response.ok){location.href='admin-login.html';return}const questions=await response.json();document.querySelector('#questions').innerHTML=questions.length?questions.map(question=>`<article class="question"><div><strong>${question.name}</strong><small>${question.email} · ${question.created_at}</small><p>${question.message}</p></div><div class="actions"><a href="mailto:${question.email}?subject=Re: your question for Let Money Earn">Reply by email ↗</a></div></article>`).join(''):'<p>No questions submitted yet.</p>'}load();</script></body></html>
