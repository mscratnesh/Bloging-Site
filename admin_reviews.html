<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review moderation | Let Money Earn</title><link rel="stylesheet" href="styles.css"><style>main{padding:55px 8vw 90px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:18px}.head h1{font:600 50px var(--serif);margin:0}.head a{color:var(--ink);font:11px var(--mono);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:5px}.add-review{max-width:640px;margin:30px 0 45px;padding:22px;border:1px solid var(--line);display:grid;gap:12px}.add-review h2{font:600 22px var(--serif);margin:0 0 4px}.add-review .hint{color:var(--muted);font-size:12px;margin:-8px 0 4px}.add-review input,.add-review select,.add-review textarea{border:1px solid var(--line);padding:11px;background:transparent;font:13px var(--sans)}.add-review textarea{min-height:70px;resize:vertical}.add-review .file-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.add-review .file-row input[type=file]{border:1px dashed var(--line);padding:9px;font-size:12px;flex:1;min-width:200px}.add-review .file-name{color:var(--muted);font:10px var(--mono)}.add-review .or-divider{color:var(--muted);font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em}.add-review button{justify-self:start;border:0;background:var(--ink);color:var(--paper);padding:11px 16px;font:11px var(--mono);cursor:pointer}.review{display:flex;justify-content:space-between;gap:25px;border-bottom:1px solid var(--line);padding:22px 0}.review small{display:block;color:var(--muted);font:10px var(--mono);margin-top:5px}.review p{max-width:700px;margin:12px 0 0;color:var(--muted)}.review img{display:block;margin-top:12px;max-width:260px;max-height:200px;border:1px solid var(--line);object-fit:cover}.actions{white-space:nowrap}.actions button{border:0;background:transparent;font:11px var(--mono);cursor:pointer;margin-left:12px}.actions button:hover{color:var(--coral)}.status{color:var(--coral);font:11px var(--mono);margin-top:20px}@media(max-width:700px){main{padding:40px 8vw}.head h1{font-size:38px}.review{display:block}.actions{margin-top:14px}.actions button{margin:0 15px 0 0}}
</style></head><body><header class="site-header"><a class="brand" href="admin.html"><img style="width:190px;max-height:62px;object-fit:contain" src="https://raw.githubusercontent.com/mscratnesh/htmlSite/main/images/Let_Money_Earn_Logo_Cropped.png" alt="Let Money Earn"></a></header><main><div class="head"><div><p class="eyebrow">Private moderation</p><h1>Customer reviews</h1></div><a href="admin.html">Post editor ↗</a></div><form class="add-review" id="add-review"><h2>Add a review</h2><p class="hint">For reviews you received by email or WhatsApp — upload the screenshot straight from your device. A caption is optional when a screenshot is added. This publishes immediately.</p><input name="name" placeholder="Customer name" required><select name="rating"><option value="5">★★★★★ Excellent</option><option value="4">★★★★ Good</option><option value="3">★★★ Average</option><option value="2">★★ Poor</option><option value="1">★ Very poor</option></select><textarea name="review" placeholder="Optional caption or quoted text"></textarea><div class="file-row"><input type="file" id="screenshot-file" accept="image/png,image/jpeg,image/gif,image/webp"><span class="file-name"></span></div><span class="or-divider">or paste a link instead</span><input name="image_url" type="url" placeholder="Screenshot URL (optional)"><button type="submit">Add review ↗</button><p class="add-status" aria-live="polite"></p></form><div id="reviews"></div><p class="status" aria-live="polite"></p></main><script>async function load(){const response=await fetch('/api/admin/reviews');if(!response.ok){location.href='admin-login.html';return}const reviews=await response.json();document.querySelector('#reviews').innerHTML=reviews.length?reviews.map(review=>`<article class="review"><div><strong>${review.name}</strong><small>${review.status} · ${'★'.repeat(review.rating)} · ${review.created_at}</small><p>${review.review}</p>${review.image_url?`<img src="${review.image_url}" alt="Screenshot from ${review.name}">`:''}</div><div class="actions">${review.status==='pending'?`<button data-id="${review.id}" data-status="approved">Approve</button><button data-id="${review.id}" data-status="rejected">Reject</button>`:''}</div></article>`).join(''):'<p>No reviews submitted yet.</p>';document.querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',async()=>{const result=await(await fetch('/api/admin/reviews/'+button.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:button.dataset.status})})).json();document.querySelector('.status').textContent=result.message||result.error;load()}))}const screenshotInput=document.querySelector('#screenshot-file');screenshotInput.addEventListener('change',()=>{document.querySelector('.file-name').textContent=screenshotInput.files[0]?screenshotInput.files[0].name:''});document.querySelector('#add-review').addEventListener('submit',async(event)=>{event.preventDefault();const form=event.target;const addStatus=form.querySelector('.add-status');const file=screenshotInput.files[0];const data={name:form.name.value.trim(),rating:form.rating.value,review:form.review.value.trim(),image_url:form.image_url.value.trim()};if(file){if(file.size>5*1024*1024){addStatus.textContent='Screenshot must be under 5 MB.';return}addStatus.textContent='Uploading screenshot…';const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const upload=await(await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:dataUrl})})).json();if(!upload.url){addStatus.textContent=upload.error||'Upload failed.';return}data.image_url=upload.url}const result=await(await fetch('/api/admin/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})).json();addStatus.textContent=result.message||result.error;if(result.message){form.reset();document.querySelector('.file-name').textContent='';load()}});load();</script></body></html>
