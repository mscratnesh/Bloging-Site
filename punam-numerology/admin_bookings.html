<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings | Punam Numerology</title><link rel="stylesheet" href="styles.css"><style>main{padding:55px 8vw 90px}.admin-nav{display:flex;gap:18px;padding:14px 0;border-bottom:1px solid var(--line);font:11px var(--mono)}.admin-nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:3px}.admin-nav a:hover,.admin-nav a.active{color:var(--ink);border-bottom-color:var(--ink)}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:18px}.head h1{font:600 50px var(--serif);margin:0}.booking{display:flex;justify-content:space-between;gap:25px;border-bottom:1px solid var(--line);padding:22px 0}.booking small{display:block;color:var(--muted);font:10px var(--mono);margin-top:5px}.booking p{max-width:700px;margin:12px 0 0;color:var(--muted)}.actions{white-space:nowrap}.actions a{color:var(--ink);text-decoration:none;font:11px var(--mono);border-bottom:1px solid var(--ink);padding-bottom:4px}.actions a:hover{color:var(--coral)}@media(max-width:700px){main{padding:40px 8vw}.head h1{font-size:38px}.booking{display:block}.actions{margin-top:14px}}</style></head><body><header class="site-header"><a class="brand" href="admin_bookings.html"><span class="brand-mark">&#10022;</span>Punam Numerology</a></header><main><nav class="admin-nav"><a class="active" href="admin_bookings.html">Bookings</a><a href="admin_reviews.html">Reviews</a><a href="admin_comments.html">Comments</a></nav><div class="head"><div><p class="eyebrow">Private inbox</p><h1>Bookings</h1></div></div><div id="bookings"></div><p class="status" aria-live="polite"></p></main><script>async function load(){const response=await fetch('/api/admin/bookings');if(!response.ok){location.href='admin-login.html';return}const bookings=await response.json();document.querySelector('#bookings').innerHTML=bookings.length?bookings.map(booking=>`<article class="booking"><div><strong>${booking.name}</strong><small>${booking.email} · ${booking.phone}${booking.dob?' · DOB '+booking.dob:''} · ${booking.service} · ${booking.created_at}</small>${booking.message?`<p>${booking.message}</p>`:''}</div><div class="actions"><a href="mailto:${booking.email}?subject=Re: your numerology reading">Reply by email &#8599;</a></div></article>`).join(''):'<p>No bookings submitted yet.</p>'}load();</script></body></html>
