<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in | Let Money Earn</title><link rel="stylesheet" href="styles.css"><style>main{min-height:70vh;display:grid;place-items:center;padding:50px 8vw}.login{width:min(100%,420px);border-top:1px solid var(--ink);padding-top:18px}.login h1{font:600 48px var(--serif);line-height:1;margin:20px 0}.login label{display:block;font:11px var(--mono);text-transform:uppercase}.login input{display:block;width:100%;margin:10px 0 16px;padding:13px;border:1px solid var(--line);background:transparent;font:14px var(--sans)}.login button{border:0;background:var(--ink);color:var(--paper);padding:13px 18px;font:11px var(--mono);cursor:pointer}.message{font:11px var(--mono);color:var(--coral)}</style></head><body><header class="site-header"><a class="brand" href="index.html"><img style="width:190px;max-height:62px;object-fit:contain" src="https://raw.githubusercontent.com/mscratnesh/htmlSite/main/images/Let_Money_Earn_Logo_Cropped.png" alt="Let Money Earn"></a></header><main><form class="login" id="login"><p class="eyebrow">Private area</p><h1>Admin sign in</h1><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button>Continue ↗</button><p class="message" aria-live="polite"></p></form></main><script>document.querySelector('#login').addEventListener('submit',async(event)=>{event.preventDefault();const message=document.querySelector('.message');const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const result=await response.json();if(response.ok)location.href='admin.html';else message.textContent=result.error});</script></body></html>
